<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>通路進入 · 鹿飛 LUFÉ（流體介面提案）</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+TC:wght@300..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/lufe.css"><style>
:root{--a:#7A5A1A;--as:rgba(212,168,92,.09);--ah:#D4A85C}.hero{position:relative;overflow:hidden;padding:calc(var(--nav-h) + 72px) 0 80px;background:var(--navy);color:#fff}.hero img,.hero i{position:absolute;inset:0;width:100%;height:100%}.hero img{object-fit:cover;opacity:.3}.hero i{background:linear-gradient(90deg,rgba(10,18,34,.9),rgba(10,18,34,.52))}.hero .wrap{position:relative}.crumb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;color:rgba(255,255,255,.6);font-size:13px}.kick,.line{color:var(--ah)}.kick{margin-bottom:14px;font-size:13px;font-weight:600;letter-spacing:.06em}.hero .lead{max-width:720px;margin-top:20px;color:rgba(255,255,255,.78)}.line{max-width:700px;margin-top:26px;font-size:17px;line-height:1.8}.a{color:var(--a)}.head{max-width:900px}.head .lead{max-width:680px;margin-top:16px}.purpose{display:grid;gap:26px;align-items:start;margin-top:32px}.marker{display:grid;place-items:center;width:128px;height:128px;color:var(--a);background:var(--as);border:1px solid rgba(122,90,26,.28);font-size:62px;line-height:1}.body{max-width:720px}.two{display:grid;gap:40px;margin-top:40px}.out,.ready{display:grid;gap:10px;list-style:none}.out li,.ready li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;padding:16px;background:#fff;border:1px solid var(--bd);color:var(--tx);line-height:1.7}.check{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--as);color:var(--a);font-weight:700}.dhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:2px}.dhead .h3{color:var(--gold-ink)}.arrows{display:flex;gap:8px}.del{min-height:210px;padding:28px;border-left:4px solid rgba(212,168,92,.75)}.del p{margin-top:12px;color:var(--tx2);font-size:14px;line-height:1.8}.car-track .del{flex-basis:clamp(270px,78vw,390px)}.process .qa .n,.process .week{color:var(--gold)}.process .qa .q{display:block;color:#fff}.week{display:block;margin-bottom:5px;font-size:13px;font-weight:600}.process .qa .ans>div{color:rgba(255,255,255,.74)}.process .qa li{margin:0 0 10px 16px;line-height:1.8}.ready{margin-top:32px}.ready li{grid-template-columns:22px 1fr;border-left:4px solid #35a66f}.ready .warn{border-left-color:#d29a24}.sign{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#35a66f;color:#fff;font-size:12px;font-weight:700}.warn .sign{background:#d29a24}.risks{display:grid;gap:14px;margin-top:24px}.risk{min-height:124px;padding:24px 26px;border-left:4px solid rgba(179,38,30,.7)}.risk .h4{color:#a32f29}.risk .plus{margin-top:auto;margin-left:auto;background:#a32f29;font-size:20px}.faq{margin-top:32px}.faq .q{color:var(--tx)}.case{margin-top:32px;overflow:hidden}.media{aspect-ratio:16/9;overflow:hidden;background:var(--cream-d)}.media img{width:100%;height:100%;object-fit:cover}.copy{padding:28px}.copy .num{margin:16px 0 12px;color:var(--gold-ink);font-size:48px;line-height:1}.copy .body{margin:12px 0 20px}.copy .link{color:var(--gold-ink)}.cta .lead{max-width:520px;margin:16px auto 34px}.acts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.stages{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stages a{min-height:132px;padding:22px}.stages a:last-child{text-align:right}.stages .h4{color:var(--tx)}.stages a:hover .h4{color:var(--a)}.xp-body .desc{color:var(--tx2);font-size:17px;line-height:1.9}@media(min-width:700px){.hero{padding-top:calc(var(--nav-h) + 104px);padding-bottom:104px}.purpose{grid-template-columns:148px 1fr;gap:40px}.marker{width:148px;height:148px;font-size:72px}.two{grid-template-columns:1fr 1fr}.risks{grid-template-columns:repeat(2,1fr)}.case{display:grid;grid-template-columns:1.15fr 1fr}.media{min-height:290px;aspect-ratio:auto}.stages{gap:24px}.stages a{padding:28px}}
</style></head><body data-page="services-channel-entry" data-hero="dark">

<template id="lufe-notes"><li><b>交付物改成可左右查看</b>：用手拖、滑鼠拖或按左右鈕都能逐張看；甩得快會多滑一些，最後停在卡片邊緣。</li><li><b>每個工作步驟先看標題</b>：想知道細節再按開，避免一開始被長清單淹沒；關掉時仍回到同一列。</li><li><b>喊停訊號只在需要時展開</b>：卡片本身先說清楚風險，按下才看判斷理由，讓重要警告容易找、不搶走全部注意力。</li><li><b>上一與下一階段位置固定</b>：回頭永遠在左、往前永遠在右，閱讀路徑不用重新猜。</li><li><b>刻意沒做</b>：數字跳動、捲動淡入、自動彈窗。</li></template>
<script src="assets/lufe.js"></script><script>
(()=>{const{carousel,expand,initQA,ICON,esc}=LUFE,d={n:"03",t:"通路進入",sub:"從試水溫到正式上架",time:"2–3 個月",line:"上架不難，難的是上對地方、用對條件。",img:"https://lufe.world/images/services/stage-03-retail-aisle.jpg",purpose:"有了測試數據之後，下一步是把產品送進對的通路。這個階段我們負責談判、合規、包裝在地化、首批出貨與鋪貨。重點不是「能不能上架」，而是「以什麼條件上架」——因為通路合約的每一條款都會影響你未來 2–3 年的利潤結構。",out:["產品正式在目標通路上架銷售","一份對你有利的通路合約（不是通路模板）","完整的合規認證與產品標示在地化","首批訂單順利出貨與鋪貨"],del:[["通路談判策略書","目標通路的採購決策流程、你的談判籌碼、底線與可讓步的條件。"],["合約審閱建議","通路合約的每一條款我們都會標注紅黃綠三色，告訴你哪些絕對不能簽、哪些可以討論、哪些沒問題。"],["包裝與標示在地化套件","符合當地法規的標示設計、語言版本、警示文字、成分說明。"],["首批訂單執行記錄","從 PO 到鋪貨的完整執行文件，未來 handover 給你團隊時有依據。"]],proc:[["Month 1","通路選擇與接洽",["根據測試數據與市場評估，鎖定 2–3 個目標通路","透過既有關係直接對接採購窗口","遞交產品資料與樣品"]],["Month 2","談判與合規",["與通路採購團隊進行 2–4 輪談判","同步進行產品合規認證與包裝修改","合約審閱與條件確認"]],["Month 3","首批出貨與上架",["首批訂單執行（PO → 生產 → 出貨 → 入倉）","上架前的通路端行銷協調","正式上架與首週銷售追蹤"]]],ready:[[1,"已完成階段 02 的產品測試，有明確的銷售數據"],[1,"產能可以支撐通路端的首批訂單"],[1,"你有足夠的營運現金流撐過 60–90 天的付款週期"],[0,"你還在尋找代工廠，沒有穩定產能"],[0,"你期待上架後 30 天內回本"]],risk:[["通路條件過於苛刻","如果採購要求的付款週期、退貨條款、行銷分攤超過你的承受範圍，我們會建議你拒絕或換通路，不會為了「上架」而上架。"],["產能跟不上","如果你的工廠無法穩定交付通路要求的量，我們會建議先把產能問題解決再進通路——空架是品牌殺手。"]],faq:[["可以同時進多個通路嗎？","初期我們建議集中火力在 1–2 個通路，確認執行品質之後再擴張。同時進多個通路會讓你的資源過度分散，品質難以控制。"],["如果我想自建品牌站而不進通路呢？","完全可以——那算是一個「特殊通路」。我們一樣會幫你規劃流量來源、物流、客服，只是結構不同。先告訴我們你的想法，我們會評估哪個策略更適合。"],["合約簽下去之後，你們還會介入嗎？","首批出貨我們會陪跑到底。之後你可以選擇接續階段 04（海外落地長期經營），或自行接手——由你決定。"]]},c={tags:["食品","北美"],num:"6 個月",title:"保健品怎麼從台灣走進北美 Costco？",sum:"從 FDA 註冊到通路談判，6 個月打進全球最大會員制零售通路。完整走過評估、測試、通路進入的每一步。",img:"https://lufe.world/images/cases/detail/costco-health-hero.jpg",href:"case.html?slug=costco-health"},prev=["services-product-testing.html","← 上一階段","02 產品測試","4–6 週"],next=["services-localization.html","下一階段 →","04 海外落地","持續（通常以 6 個月為一期）"],p=(x,i)=>`<div class="qa"><button type="button"><span class="n">${String(i+1).padStart(2,"0")}</span><span><span class="week">${esc(x[0])}</span><span class="q">${esc(x[1])}</span></span><span class="chev">${ICON.chevDown}</span></button><div class="ans"><div><ul>${x[2].map(y=>`<li>${esc(y)}</li>`).join("")}</ul></div></div></div>`,f=(x,i)=>`<div class="qa${i===0?" open":""}"><button type="button"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="q">${esc(x[0])}</span><span class="chev">${ICON.chevDown}</span></button><div class="ans"><div><p class="body">${esc(x[1])}</p></div></div></div>`;
document.getElementById("m").innerHTML=`<section class="hero"><img src="${d.img}" alt=""><i></i><div class="wrap"><nav class="crumb" aria-label="麵包屑"><a href="services.html">服務</a><span>/</span><span>階段 ${d.n}</span></nav><p class="kick">STAGE ${d.n} · ${d.time}</p><h1 class="h1">${d.t}</h1><p class="lead">${d.sub}</p><p class="line">${d.line}</p></div></section><section><div class="wrap"><div class="head"><h2 class="h2">為什麼要有<span class="a">這個階段</span></h2><div class="purpose"><div class="marker num">${d.n}</div><p class="body">${d.purpose}</p></div></div></div></section><section class="cream"><div class="wrap"><div class="head"><h2 class="h2">這階段結束時，<span class="a">你會拿到什麼</span></h2><p class="lead">不是抽象承諾，分成兩層：你會「知道」什麼，以及你會實際「拿到」什麼。</p></div><div class="two"><div><h3 class="h3 a" style="margin-bottom:16px">你會知道什麼</h3><ul class="out">${d.out.map(x=>`<li><span class="check">✓</span><span>${esc(x)}</span></li>`).join("")}</ul></div><div><div class="dhead"><h3 class="h3">你會實際拿到</h3><div class="arrows"><button class="round" id="l" type="button" aria-label="上一份交付物"></button><button class="round" id="r" type="button" aria-label="下一份交付物"></button></div></div><div class="car-vp" id="v" aria-roledescription="carousel" aria-label="你會實際拿到"><div class="car-track">${d.del.map(x=>`<article class="card del"><h4 class="h4">${esc(x[0])}</h4><p>${esc(x[1])}</p></article>`).join("")}</div></div></div></div></div></section><section class="dark process"><div class="wrap-narrow"><div class="head"><h2 class="h2"><span style="color:var(--gold)">${d.time}</span> 的實際節奏</h2><p class="lead">每個階段我們都有明確的週進度，不會讓你不知道現在在做什麼。</p></div><div style="margin-top:40px">${d.proc.map(p).join("")}</div></div></section><section class="cream"><div class="wrap-narrow"><div class="head"><h2 class="h2">你<span class="a">是不是該</span>進這個階段</h2><p class="lead">兩個自我檢視：第一個看你準備好了沒，第二個看有沒有該先喊停的訊號。</p></div><h3 class="h3" style="color:#26784f;margin-top:34px">準備好的訊號</h3><ul class="ready">${d.ready.map(x=>`<li class="${x[0]?"":"warn"}"><span class="sign">${x[0]?"✓":"!"}</span><span>${esc(x[1])}</span></li>`).join("")}</ul><div style="margin-top:52px"><h3 class="h3" style="color:#a32f29">如果遇到這些，我們會喊停</h3><div class="risks">${d.risk.map(x=>`<button class="card risk" type="button" data-t="${esc(x[0])}" data-d="${esc(x[1])}"><h4 class="h4">${esc(x[0])}</h4><span class="plus">+</span></button>`).join("")}</div></div></div></section><section><div class="wrap-narrow"><h2 class="h2">這階段最常被問到的問題</h2><div class="faq">${d.faq.map(f).join("")}</div></div></section><section class="cream"><div class="wrap-narrow"><h2 class="h2">這階段在真實案子裡<span class="a">長什麼樣</span></h2><a class="card case" href="${c.href}"><div class="media"><img src="${c.img}" alt="${c.title}"></div><div class="copy"><div>${c.tags.map((x,i)=>`<span class="tag" style="margin-right:6px;${i?"color:var(--gold-ink);background:rgba(212,168,92,.14)":""}">${x}</span>`).join("")}</div><div class="num">${c.num}</div><h3 class="h3">${c.title}</h3><p class="body">${c.sum}</p><span class="link">看完整案例 <span class="chev">›</span></span></div></a></div></section><section class="dark center cta"><div class="wrap"><h2 class="h2">準備好進入<span class="accent">${d.t}</span>了嗎？</h2><p class="lead">聊聊你的狀況，我們會告訴你這個階段對你是不是現在最該做的事。</p><div class="acts"><button class="btn btn-gold" type="button" data-chat>聊聊你的產品</button><a class="btn btn-glass" href="assess.html">先做 2 分鐘處境比對</a></div></div></section><section class="tight"><div class="wrap"><nav class="stages" aria-label="服務階段">${[prev,next].map(x=>`<a class="card" href="${x[0]}"><p class="small">${x[1]}</p><h3 class="h4">${x[2]}</h3><p class="small" style="margin-top:5px">${x[3]}</p></a>`).join("")}</nav></div></section>`;const nav=document.getElementById("nav"),hero=document.querySelector("#m > section"),updateNav=()=>nav.classList.toggle("solid",hero.getBoundingClientRect().bottom<=56);addEventListener("scroll",updateNav,{passive:true});addEventListener("resize",updateNav);updateNav();const l=document.getElementById("l"),r=document.getElementById("r");l.innerHTML=ICON.left;r.innerHTML=ICON.right;carousel(document.getElementById("v"),{prev:l,next:r});document.querySelectorAll("[data-t]").forEach(x=>x.addEventListener("click",()=>expand(x,{html:`<h2 class="h2" id="xpTitle">${x.dataset.t}</h2><p class="desc" style="margin-top:22px">${x.dataset.d}</p>`})));initQA(document.getElementById("m"));})();
</script></body></html>
