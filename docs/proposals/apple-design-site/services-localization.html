<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>海外落地 · 鹿飛 LUFÉ（流體介面提案）</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+TC:wght@300..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/lufe.css"><style>
:root{--a:#9A4F1A;--as:rgba(217,139,74,.09);--ah:#A45A20}.hero{position:relative;overflow:hidden;padding:calc(var(--nav-h) + 72px) 0 80px;background:var(--navy);color:#fff}.hero img,.hero i{position:absolute;inset:0;width:100%;height:100%}.hero img{object-fit:cover;opacity:.3}.hero i{background:linear-gradient(90deg,rgba(10,18,34,.9),rgba(10,18,34,.52))}.hero .wrap{position:relative}.crumb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;color:rgba(255,255,255,.6);font-size:13px}.kick,.line{color:var(--ah)}.kick{margin-bottom:14px;font-size:13px;font-weight:600;letter-spacing:.06em}.hero .lead{max-width:720px;margin-top:20px;color:rgba(255,255,255,.78)}.line{max-width:700px;margin-top:26px;font-size:17px;line-height:1.8}.a{color:var(--a)}.head{max-width:900px}.head .lead{max-width:680px;margin-top:16px}.purpose{display:grid;gap:26px;align-items:start;margin-top:32px}.marker{display:grid;place-items:center;width:128px;height:128px;color:var(--a);background:var(--as);border:1px solid rgba(154,79,26,.28);font-size:62px;line-height:1}.body{max-width:720px}.two{display:grid;gap:40px;margin-top:40px}.out,.ready{display:grid;gap:10px;list-style:none}.out li,.ready li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;padding:16px;background:#fff;border:1px solid var(--bd);color:var(--tx);line-height:1.7}.check{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--as);color:var(--a);font-weight:700}.dhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:2px}.dhead .h3{color:var(--gold-ink)}.arrows{display:flex;gap:8px}.del{min-height:210px;padding:28px;border-left:4px solid rgba(212,168,92,.75)}.del p{margin-top:12px;color:var(--tx2);font-size:14px;line-height:1.8}.car-track .del{flex-basis:clamp(270px,78vw,390px)}.process .qa .n,.process .week{color:var(--gold)}.process .qa .q{display:block;color:#fff}.week{display:block;margin-bottom:5px;font-size:13px;font-weight:600}.process .qa .ans>div{color:rgba(255,255,255,.74)}.process .qa li{margin:0 0 10px 16px;line-height:1.8}.ready{margin-top:32px}.ready li{grid-template-columns:22px 1fr;border-left:4px solid #35a66f}.ready .warn{border-left-color:#d29a24}.sign{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#35a66f;color:#fff;font-size:12px;font-weight:700}.warn .sign{background:#d29a24}.risks{display:grid;gap:14px;margin-top:24px}.risk{min-height:124px;padding:24px 26px;border-left:4px solid rgba(179,38,30,.7)}.risk .h4{color:#a32f29}.risk .plus{margin-top:auto;margin-left:auto;background:#a32f29;font-size:20px}.faq{margin-top:32px}.faq .q{color:var(--tx)}.case{margin-top:32px;overflow:hidden}.media{aspect-ratio:16/9;overflow:hidden;background:var(--cream-d)}.media img{width:100%;height:100%;object-fit:cover}.copy{padding:28px}.copy .num{margin:16px 0 12px;color:var(--gold-ink);font-size:48px;line-height:1}.copy .body{margin:12px 0 20px}.copy .link{color:var(--gold-ink)}.cta .lead{max-width:520px;margin:16px auto 34px}.acts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.stages{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stages a{min-height:132px;padding:22px}.stages a:last-child{text-align:right}.stages .h4{color:var(--tx)}.stages a:hover .h4{color:var(--a)}.xp-body .desc{color:var(--tx2);font-size:17px;line-height:1.9}@media(min-width:700px){.hero{padding-top:calc(var(--nav-h) + 104px);padding-bottom:104px}.purpose{grid-template-columns:148px 1fr;gap:40px}.marker{width:148px;height:148px;font-size:72px}.two{grid-template-columns:1fr 1fr}.risks{grid-template-columns:repeat(2,1fr)}.case{display:grid;grid-template-columns:1.15fr 1fr}.media{min-height:290px;aspect-ratio:auto}.stages{gap:24px}.stages a{padding:28px}}
</style></head><body data-page="services-localization" data-hero="dark">
<div data-lufe-nav></div>
<main id="m"></main>
<div data-lufe-footer></div>
<template id="lufe-notes"><li><b>交付物改成可左右查看</b>：用手拖、滑鼠拖或按左右鈕都能逐張看；甩得快會多滑一些，最後停在卡片邊緣。</li><li><b>每個工作步驟先看標題</b>：想知道細節再按開，避免一開始被長清單淹沒；關掉時仍回到同一列。</li><li><b>喊停訊號只在需要時展開</b>：卡片本身先說清楚風險，按下才看判斷理由，讓重要警告容易找、不搶走全部注意力。</li><li><b>上一與下一階段位置固定</b>：回頭永遠在左、往前永遠在右，閱讀路徑不用重新猜。</li><li><b>刻意沒做</b>：數字跳動、捲動淡入、自動彈窗。</li></template>
<script src="assets/lufe.js"></script><script>
(()=>{const{carousel,expand,initQA,ICON,esc}=LUFE,d={n:"04",t:"海外落地",sub:"不只是賣出去，還要站得穩",time:"持續（通常以 6 個月為一期）",line:"進去是一次性的，站穩是持續的。",img:"https://lufe.world/images/services/stage-04-asian-team.jpg",purpose:"產品上架不等於成功。真正的長期成功來自於在當地建立可持續的營運體系：穩定的供應鏈、在地客服、行銷節奏、通路關係維護、以及數據驅動的迭代。這個階段我們轉換成長期夥伴的角色，陪你把「一次性上架」變成「持續成長的業務」。",out:["一套可持續運作的在地營運體系","穩定的通路績效與月度銷售節奏","在地團隊或夥伴關係（根據你的資源規模選擇）","數據儀表板與月度復盤機制"],del:[["營運手冊","從供應鏈、庫存管理、客服流程到通路溝通，全部標準化成可執行的 SOP。"],["月度營運報告","銷售、庫存、客服、通路表現的整合報告，加上下個月的行動建議。"],["在地夥伴網絡","物流、倉儲、客服、行銷的當地合作夥伴名單與已談妥的合作條件。"],["數據儀表板","即時看得到銷售與庫存的自建 dashboard（或接入你既有的 BI 系統）。"]],proc:[["Month 1–2","體系建構",["SOP 建立：供應鏈、庫存、客服、通路溝通","在地夥伴選定與簽約","數據追蹤體系上線"]],["Month 3–4","迭代與優化",["月度復盤會議","根據數據調整 SKU、定價、鋪貨策略","客戶反饋循環"]],["Month 5–6","擴張準備",["評估擴展到第二個通路或第二個市場的可行性","產能與供應鏈的擴充規劃","handover 給你的內部團隊（如果你要自己接手）"]]],ready:[[1,"產品已在目標通路正式銷售"],[1,"有月度 review 與持續優化的意願"],[1,"願意投入至少 6 個月的時間讓數據累積"],[0,"你只想上架就好，長期運營想自己來"],[0,"你沒有資源支撐持續的庫存與行銷投入"]],risk:[["首三個月銷售遠低於預期","如果實際銷售只有預估的 30% 以下，我們會先停下來檢討，而不是盲目加碼。"],["通路關係惡化","如果通路採購與你開始產生信任問題，我們會介入修復，必要時協助你退出。"]],faq:[["這階段的費用怎麼算？","通常以月費 + 績效獎金的混合模式。月費覆蓋基礎營運支援，績效獎金與銷售成長掛鉤。我們不做純佣金制——因為那會扭曲決策。"],["可以只做 3 個月嗎？","理論上可以，但通常不建議。數據要跑滿一個完整的季節週期才能看出趨勢，3 個月太短，判斷容易失真。"],["你們會幫我建在地團隊嗎？","會，但我們不做純招聘。我們會幫你找到關鍵角色（例如在地 country manager），但日常的行政招聘建議交給當地 HR 公司。"]]},c={tags:["飲品","東南亞"],num:"10 家",title:"珍珠奶茶品牌怎麼在菲律賓成功落地？",sum:"從市場探索到門市營運，一年開設 10 家門市，建立穩定營收基地。",img:"https://lufe.world/images/cases/detail/bubbletea-manila-hero.jpg",href:"case.html?slug=bubble-tea"},prev=["services-channel-entry.html","← 上一階段","03 通路進入","2–3 個月"],next=["services-optimize.html","進階方案 →","運營優化方案","已經在海外，想做更好"],p=(x,i)=>`<div class="qa"><button type="button"><span class="n">${String(i+1).padStart(2,"0")}</span><span><span class="week">${esc(x[0])}</span><span class="q">${esc(x[1])}</span></span><span class="chev">${ICON.chevDown}</span></button><div class="ans"><div><ul>${x[2].map(y=>`<li>${esc(y)}</li>`).join("")}</ul></div></div></div>`,f=(x,i)=>`<div class="qa${i===0?" open":""}"><button type="button"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="q">${esc(x[0])}</span><span class="chev">${ICON.chevDown}</span></button><div class="ans"><div><p class="body">${esc(x[1])}</p></div></div></div>`;
document.getElementById("m").innerHTML=`<section class="hero"><img src="${d.img}" alt=""><i></i><div class="wrap"><nav class="crumb" aria-label="麵包屑"><a href="services.html">服務</a><span>/</span><span>階段 ${d.n}</span></nav><p class="kick">STAGE ${d.n} · ${d.time}</p><h1 class="h1">${d.t}</h1><p class="lead">${d.sub}</p><p class="line">${d.line}</p></div></section><section><div class="wrap"><div class="head"><h2 class="h2">為什麼要有<span class="a">這個階段</span></h2><div class="purpose"><div class="marker num">${d.n}</div><p class="body">${d.purpose}</p></div></div></div></section><section class="cream"><div class="wrap"><div class="head"><h2 class="h2">這階段結束時，<span class="a">你會拿到什麼</span></h2><p class="lead">不是抽象承諾，分成兩層：你會「知道」什麼，以及你會實際「拿到」什麼。</p></div><div class="two"><div><h3 class="h3 a" style="margin-bottom:16px">你會知道什麼</h3><ul class="out">${d.out.map(x=>`<li><span class="check">✓</span><span>${esc(x)}</span></li>`).join("")}</ul></div><div><div class="dhead"><h3 class="h3">你會實際拿到</h3><div class="arrows"><button class="round" id="l" type="button" aria-label="上一份交付物"></button><button class="round" id="r" type="button" aria-label="下一份交付物"></button></div></div><div class="car-vp" id="v" aria-roledescription="carousel" aria-label="你會實際拿到"><div class="car-track">${d.del.map(x=>`<article class="card del"><h4 class="h4">${esc(x[0])}</h4><p>${esc(x[1])}</p></article>`).join("")}</div></div></div></div></div></section><section class="dark process"><div class="wrap-narrow"><div class="head"><h2 class="h2"><span style="color:var(--gold)">${d.time}</span> 的實際節奏</h2><p class="lead">每個階段我們都有明確的週進度，不會讓你不知道現在在做什麼。</p></div><div style="margin-top:40px">${d.proc.map(p).join("")}</div></div></section><section class="cream"><div class="wrap-narrow"><div class="head"><h2 class="h2">你<span class="a">是不是該</span>進這個階段</h2><p class="lead">兩個自我檢視：第一個看你準備好了沒，第二個看有沒有該先喊停的訊號。</p></div><h3 class="h3" style="color:#26784f;margin-top:34px">準備好的訊號</h3><ul class="ready">${d.ready.map(x=>`<li class="${x[0]?"":"warn"}"><span class="sign">${x[0]?"✓":"!"}</span><span>${esc(x[1])}</span></li>`).join("")}</ul><div style="margin-top:52px"><h3 class="h3" style="color:#a32f29">如果遇到這些，我們會喊停</h3><div class="risks">${d.risk.map(x=>`<button class="card risk" type="button" data-t="${esc(x[0])}" data-d="${esc(x[1])}"><h4 class="h4">${esc(x[0])}</h4><span class="plus">+</span></button>`).join("")}</div></div></div></section><section><div class="wrap-narrow"><h2 class="h2">這階段最常被問到的問題</h2><div class="faq">${d.faq.map(f).join("")}</div></div></section><section class="cream"><div class="wrap-narrow"><h2 class="h2">這階段在真實案子裡<span class="a">長什麼樣</span></h2><a class="card case" href="${c.href}"><div class="media"><img src="${c.img}" alt="${c.title}"></div><div class="copy"><div>${c.tags.map((x,i)=>`<span class="tag" style="margin-right:6px;${i?"color:var(--gold-ink);background:rgba(212,168,92,.14)":""}">${x}</span>`).join("")}</div><div class="num">${c.num}</div><h3 class="h3">${c.title}</h3><p class="body">${c.sum}</p><span class="link">看完整案例 <span class="chev">›</span></span></div></a></div></section><section class="dark center cta"><div class="wrap"><h2 class="h2">準備好進入<span class="accent">${d.t}</span>了嗎？</h2><p class="lead">聊聊你的狀況，我們會告訴你這個階段對你是不是現在最該做的事。</p><div class="acts"><button class="btn btn-gold" type="button" data-chat>聊聊你的產品</button><a class="btn btn-glass" href="assess.html">先做 2 分鐘處境比對</a></div></div></section><section class="tight"><div class="wrap"><nav class="stages" aria-label="服務階段">${[prev,next].map(x=>`<a class="card" href="${x[0]}"><p class="small">${x[1]}</p><h3 class="h4">${x[2]}</h3><p class="small" style="margin-top:5px">${x[3]}</p></a>`).join("")}</nav></div></section>`;const nav=document.getElementById("nav"),hero=document.querySelector("#m > section"),updateNav=()=>nav.classList.toggle("solid",hero.getBoundingClientRect().bottom<=56);addEventListener("scroll",updateNav,{passive:true});addEventListener("resize",updateNav);updateNav();const l=document.getElementById("l"),r=document.getElementById("r");l.innerHTML=ICON.left;r.innerHTML=ICON.right;carousel(document.getElementById("v"),{prev:l,next:r});document.querySelectorAll("[data-t]").forEach(x=>x.addEventListener("click",()=>expand(x,{html:`<h2 class="h2" id="xpTitle">${x.dataset.t}</h2><p class="desc" style="margin-top:22px">${x.dataset.d}</p>`})));initQA(document.getElementById("m"));})();
</script></body></html>
