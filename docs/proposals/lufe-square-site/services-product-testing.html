<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>產品測試 · 鹿飛 LUFÉ（方正版提案）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+TC:wght@300..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/lufe.css">
<style>
:root{--stage:#2F5A70;--stage-soft:rgba(58,107,132,.07);--stage-line:rgba(47,90,112,.26);--stage-hero:#3A6B84}.stage-hero{position:relative;overflow:hidden;padding:calc(var(--nav-h) + 72px) 0 80px;background:var(--navy);color:#fff}.bgimg,.shade{position:absolute;inset:0;width:100%;height:100%}.bgimg{object-fit:cover;opacity:.3}.shade{background:linear-gradient(90deg,rgba(10,18,34,.9),rgba(10,18,34,.52))}.stage-hero .wrap{position:relative}.crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;font-size:13px;color:rgba(255,255,255,.6)}.stage-kicker,.hero-line{color:var(--stage-hero)}.stage-kicker{margin-bottom:14px;font-size:13px;font-weight:600;letter-spacing:.06em}.stage-hero .lead{max-width:720px;margin-top:20px;color:rgba(255,255,255,.78)}.hero-line{max-width:700px;margin-top:26px;font-size:17px;line-height:1.8}.accent{color:var(--stage)}.stage-head{max-width:900px}.stage-head .lead{max-width:680px;margin-top:16px}.purpose{display:grid;gap:26px;align-items:start;margin-top:32px}.marker{display:grid;place-items:center;width:128px;height:128px;color:var(--stage);background:var(--stage-soft);border:1px solid var(--stage-line);font-size:62px;line-height:1}.body{max-width:720px}.two{display:grid;gap:40px;margin-top:40px}.outcomes,.ready{display:grid;gap:10px;list-style:none}.outcomes li,.ready li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;padding:16px;background:#fff;border:1px solid var(--bd);color:var(--tx);line-height:1.7}.check{display:grid;place-items:center;width:24px;height:24px;border-radius:0;background:var(--stage-soft);color:var(--stage);font-weight:700}.deliver-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:2px}.deliver-head .h3{color:var(--gold-ink)}.carousel-actions{display:flex;gap:8px}.deliver{min-height:210px;padding:28px;border-left:4px solid rgba(212,168,92,.75)}.deliver p{margin-top:12px;color:var(--tx2);font-size:14px;line-height:1.8}.car-track .deliver{flex-basis:clamp(270px,78vw,390px)}.process .qa .n,.process .step-week{color:var(--gold)}.process .qa .q{display:block;color:#fff}.step-week{display:block;margin-bottom:5px;font-size:13px;font-weight:600}.process .qa .ans>div{color:rgba(255,255,255,.74)}.process .qa li{margin:0 0 10px 16px;line-height:1.8}.ready{margin-top:32px}.ready li{grid-template-columns:22px 1fr;border-left:4px solid #35a66f}.ready .warn{border-left-color:#d29a24}.sign{display:grid;place-items:center;width:20px;height:20px;border-radius:0;background:#35a66f;color:#fff;font-size:12px;font-weight:700}.warn .sign{background:#d29a24}.risk-head{margin-top:52px}.risks{display:grid;gap:14px;margin-top:24px}.risk{min-height:124px;padding:24px 26px;border-left:4px solid rgba(179,38,30,.7)}.risk .h4{color:#a32f29}.risk .plus{margin-top:auto;margin-left:auto;background:#a32f29;font-size:20px}.xp-body .risk-desc{color:var(--tx2);font-size:17px;line-height:1.9}.faq{margin-top:32px}.faq .q{color:var(--tx)}.case{margin-top:32px;overflow:hidden}.case-media{aspect-ratio:16/9;overflow:hidden;background:var(--cream-d)}.case-media img{width:100%;height:100%;object-fit:cover}.case-copy{padding:28px}.case-copy .num{margin:16px 0 12px;color:var(--gold-ink);font-size:48px;line-height:1}.case-copy .body{margin:12px 0 20px}.case-copy .link{color:var(--gold-ink)}.stage-cta .lead{max-width:520px;margin:16px auto 34px}.acts,.nav-stage{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.nav-stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}.nav-stage a{min-height:132px;padding:22px}.nav-stage a:last-child{text-align:right}.nav-stage .h4{color:var(--tx)}.nav-stage a:hover .h4{color:var(--stage)}
@media(min-width:700px){.stage-hero{padding-top:calc(var(--nav-h) + 104px);padding-bottom:104px}.purpose{grid-template-columns:148px 1fr;gap:40px}.marker{width:148px;height:148px;font-size:72px}.two{grid-template-columns:1fr 1fr}.risks{grid-template-columns:repeat(3,1fr)}.case{display:grid;grid-template-columns:1.15fr 1fr}.case-media{min-height:290px;aspect-ratio:auto}.nav-stage{gap:24px}.nav-stage a{padding:28px}}

/* Grid items default to min-width:auto and can blow past the viewport on phones. */
.two > *, .grid-2 > *, .grid-3 > *, .grid-4 > * { min-width: 0; }
</style>
</head>
<body data-page="services-product-testing" data-hero="dark">
<div data-lufe-nav></div>
<main id="stageMain"></main>
<div data-lufe-footer></div>
<template id="lufe-notes"><li><b>交付物改成可左右查看</b>：用手拖、滑鼠拖或按左右鈕都能逐張看；甩得快會多滑一些，最後停在卡片邊緣。</li><li><b>每個工作步驟先看標題</b>：想知道細節再按開，避免一開始被長清單淹沒；關掉時仍回到同一列。</li><li><b>喊停訊號只在需要時展開</b>：卡片本身先說清楚風險，按下才看判斷理由，讓重要警告容易找、不搶走全部注意力。</li><li><b>上一與下一階段位置固定</b>：回頭永遠在左、往前永遠在右，閱讀路徑不用重新猜。</li><li><b>刻意沒做</b>：數字跳動、捲動淡入、自動彈窗。</li></template>
<script src="assets/lufe.js"></script>
<script>
(() => {
const {carousel,expand,initQA,ICON,esc}=LUFE;
const s={n:"02",t:"產品測試",sub:"小批量投放，用真實數據取代主觀猜測",time:"4–6 週",line:"市場會告訴你答案——前提是你問對了問題。",img:"https://lufe.world/images/services/stage-02-product-test.jpg",purpose:"評估報告告訴你「應該可以」，但真的出海前你還需要實證。這個階段我們用小批量投放的方式，讓真實消費者用錢投票。數據會告訴你：這個定價站得住嗎？這個包裝打動人嗎？這個通路導得了流嗎？",out:["一組真實的銷售數據（不是問卷調查的偏好）","不同定價 / 包裝 / 通路組合的 AB 測試結果","消費者反饋：為什麼買、為什麼不買、會不會回購","進一步放大的可行性判斷"],del:[["測試計畫書","測試哪些變數、在哪裡測、測多久、成功指標是什麼。"],["測試執行報告","實際銷售數據、消費者評論、退貨率、客服問題分類。"],["AB 對照數據表","不同定價 / 包裝 / 文案的轉換率差異，用數據告訴你哪個方案勝出。"],["下一階段調整建議","基於測試結果，哪些東西要改、哪些東西可以直接放大、哪些要放棄。"]],proc:[["Week 1","設計測試變數",["決定測試市場（通常是目標市場的次級城市或特定電商平台）","設計 2–3 組對照：定價帶、包裝、通路","準備小批量庫存與物流"]],["Week 2–3","鋪貨與啟動",["產品入倉並上線","基礎行銷素材上架（不做大型廣告，避免污染自然流量）","第一批銷售與客服資料蒐集"]],["Week 4–5","持續觀測與 iterate",["每週追蹤銷售、轉換率、退貨","消費者訪談（至少 10 位實際購買者）","如發現明顯問題，快速微調並繼續觀測"]],["Week 6","結論與放大判斷",["完整測試報告","與你的團隊決策會議","如果結果支持放大，直接進入階段 03 的通路規劃"]]],ready:[[1,"已完成階段 01 的市場評估，有明確的切入市場"],[1,"有足夠的產品庫存可投入小批量測試（通常 100–500 件）"],[1,"你接受「數據可能否定你的直覺」這個前提"],[0,"你已經準備好大量訂單了，只是想快速驗證"],[0,"你的產品還需要修改配方或外觀"]],risk:[["測試樣本太少","如果總樣本數 < 100，數據噪音會大於訊號。我們會建議先集資到足夠的樣本量再啟動。"],["高退貨率","如果測試期退貨率超過 15%，通常代表產品本身或期待值管理出了問題。我們會先回頭修這個，而不是繼續放大。"],["毛利被廣告吃光","如果要靠廣告才賣得動，放大後一定會被 CAC 壓垮。我們會建議先調整通路或定位。"]],faq:[["測試階段的成本大約多少？","視產品類型差異很大。快消品（食品、保健品）通常在 50–150 萬台幣之間，包含產品成本、物流、倉儲、測試期廣告與客服。我們會在計畫書階段給你精確的預算範圍。"],["可以只測線上通路，不測實體嗎？","可以，而且大多數情況下我們會建議從線上開始——數據收集更快、變數控制更容易。實體通路的測試成本高、時間長，通常留到階段 03 正式進入通路時才做。"],["如果測試結果不如預期，代表要放棄這個市場嗎？","不一定。測試結果通常分三類：明確失敗（產品 / 市場錯配）、需要調整（定價或定位可改）、出乎意料好（可以直接放大）。我們會幫你判斷是哪一類，以及下一步該做什麼。"]]};
const c={tags:["服飾","美國"],num:"3x",title:"知名皮鞋品牌為什麼改賣襪子大賺？",sum:"分析亞馬遜數據後調整品類策略，找到高毛利藍海品項。三個月做到三倍營收。",img:"https://lufe.world/images/cases/detail/shoe-brand-hero.jpg",href:"case.html?slug=shoe-brand"}; const prev=["services-market-assessment.html","← 上一階段","01 市場評估","2–4 週"],next=["services-channel-entry.html","下一階段 →","03 通路進入","2–3 個月"];
const process=(x,i)=>`<div class="qa"><button type="button"><span class="n">${String(i+1).padStart(2,"0")}</span><span><span class="step-week">${esc(x[0])}</span><span class="q">${esc(x[1])}</span></span><span class="chev" aria-hidden="true">${ICON.chevDown}</span></button><div class="ans"><div><ul>${x[2].map(y=>`<li>${esc(y)}</li>`).join("")}</ul></div></div></div>`;const fa=(x,i)=>`<div class="qa${i===0?" open":""}"><button type="button"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="q">${esc(x[0])}</span><span class="chev" aria-hidden="true">${ICON.chevDown}</span></button><div class="ans"><div><p class="body">${esc(x[1])}</p></div></div></div>`;
document.getElementById("stageMain").innerHTML=`<section class="stage-hero"><img class="bgimg" src="${s.img}" alt=""><div class="shade"></div><div class="wrap"><nav class="crumbs" aria-label="麵包屑"><a href="services.html">服務</a><span>/</span><span>階段 ${s.n}</span></nav><p class="stage-kicker">STAGE ${s.n} · ${s.time}</p><h1 class="h1">${s.t}</h1><p class="lead">${s.sub}</p><p class="hero-line">${s.line}</p></div></section><section><div class="wrap"><div class="stage-head"><h2 class="h2">為什麼要有<span class="accent">這個階段</span></h2><div class="purpose"><div class="marker num">${s.n}</div><p class="body">${s.purpose}</p></div></div></div></section><section class="cream"><div class="wrap"><div class="stage-head"><h2 class="h2">這階段結束時，<span class="accent">你會拿到什麼</span></h2><p class="lead">不是抽象承諾，分成兩層：你會「知道」什麼，以及你會實際「拿到」什麼。</p></div><div class="two"><div><h3 class="h3 accent" style="margin-bottom:16px">你會知道什麼</h3><ul class="outcomes">${s.out.map(x=>`<li><span class="check">✓</span><span>${esc(x)}</span></li>`).join("")}</ul></div><div><div class="deliver-head"><h3 class="h3">你會實際拿到</h3><div class="carousel-actions"><button class="round" id="dp" type="button" aria-label="上一份交付物"></button><button class="round" id="dn" type="button" aria-label="下一份交付物"></button></div></div><div class="car-vp" id="dv" aria-roledescription="carousel" aria-label="你會實際拿到"><div class="car-track">${s.del.map(x=>`<article class="card deliver"><h4 class="h4">${esc(x[0])}</h4><p>${esc(x[1])}</p></article>`).join("")}</div></div></div></div></div></section><section class="dark process"><div class="wrap-narrow"><div class="stage-head"><h2 class="h2"><span style="color:var(--gold)">${s.time}</span> 的實際節奏</h2><p class="lead">每個階段我們都有明確的週進度，不會讓你不知道現在在做什麼。</p></div><div style="margin-top:40px">${s.proc.map(process).join("")}</div></div></section><section class="cream"><div class="wrap-narrow"><div class="stage-head"><h2 class="h2">你<span class="accent">是不是該</span>進這個階段</h2><p class="lead">兩個自我檢視：第一個看你準備好了沒，第二個看有沒有該先喊停的訊號。</p></div><h3 class="h3" style="color:#26784f;margin-top:34px">準備好的訊號</h3><ul class="ready">${s.ready.map(x=>`<li class="${x[0]?"":"warn"}"><span class="sign">${x[0]?"✓":"!"}</span><span>${esc(x[1])}</span></li>`).join("")}</ul><div class="risk-head"><h3 class="h3" style="color:#a32f29">如果遇到這些，我們會喊停</h3><div class="risks">${s.risk.map(x=>`<button type="button" class="card risk" data-t="${esc(x[0])}" data-d="${esc(x[1])}"><h4 class="h4">${esc(x[0])}</h4><span class="plus">+</span></button>`).join("")}</div></div></div></section><section><div class="wrap-narrow"><h2 class="h2">這階段最常被問到的問題</h2><div class="faq">${s.faq.map(fa).join("")}</div></div></section><section class="cream"><div class="wrap-narrow"><h2 class="h2">這階段在真實案子裡<span class="accent">長什麼樣</span></h2><a class="card case" href="${c.href}"><div class="case-media"><img src="${c.img}" alt="${c.title}"></div><div class="case-copy"><div>${c.tags.map((x,i)=>`<span class="tag" style="margin-right:6px;${i?"color:var(--gold-ink);background:rgba(212,168,92,.14)":""}">${x}</span>`).join("")}</div><div class="num">${c.num}</div><h3 class="h3">${c.title}</h3><p class="body">${c.sum}</p><span class="link">看完整案例 <span class="chev">›</span></span></div></a></div></section><section class="dark center stage-cta"><div class="wrap"><h2 class="h2">準備好進入<span class="accent">${s.t}</span>了嗎？</h2><p class="lead">聊聊你的狀況，我們會告訴你這個階段對你是不是現在最該做的事。</p><div class="acts"><button class="btn btn-gold" type="button" data-chat>聊聊你的產品 →</button><a class="btn btn-glass" href="assess.html">先做 2 分鐘評估 →</a></div></div></section><section class="tight"><div class="wrap"><nav class="nav-stage" aria-label="服務階段">${[prev,next].map(x=>`<a class="card" href="${x[0]}"><p class="small">${x[1]}</p><h3 class="h4">${x[2]}</h3><p class="small" style="margin-top:5px">${x[3]}</p></a>`).join("")}</nav></div></section>`;
const nav=document.getElementById("nav"),hero=document.querySelector("#stageMain > section"),updateNav=()=>nav.classList.toggle("solid",hero.getBoundingClientRect().bottom<=56);addEventListener("scroll",updateNav,{passive:true});addEventListener("resize",updateNav);updateNav();const p=document.getElementById("dp"),n=document.getElementById("dn");p.innerHTML=ICON.left;n.innerHTML=ICON.right;carousel(document.getElementById("dv"),{prev:p,next:n});document.querySelectorAll("[data-t]").forEach(x=>x.addEventListener("click",()=>expand(x,{html:`<h2 class="h2" id="xpTitle">${x.dataset.t}</h2><p class="risk-desc" style="margin-top:22px">${x.dataset.d}</p>`})));initQA(document.getElementById("stageMain"));
})();
</script><script>
(() => {
  document.querySelector('.stage-cta [data-chat]').textContent = '聊聊你的產品 →';
  document.querySelector('.stage-cta a[href="assess.html"]').textContent = '先做 2 分鐘評估 →';
  document.querySelectorAll('.case .link .chev').forEach((chev) => { chev.textContent = '→'; });
})();
</script></body></html>
