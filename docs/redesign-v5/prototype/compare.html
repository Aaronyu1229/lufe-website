<style>

body{font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
aside{background:var(--navy);color:#fff;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}

.brand span{font-size:12.5px;color:rgba(255,255,255,.55)}
.tabsw{display:flex;gap:4px;margin:14px 16px 6px;background:rgba(255,255,255,.06);padding:3px}
.tabsw button{flex:1;font:inherit;font-size:13px;padding:7px;border:0;background:none;color:rgba(255,255,255,.7);cursor:pointer}
.tabsw button.on{background:var(--gold);color:var(--navy);font-weight:700}
nav{padding:6px 10px 30px}
.pg{margin-top:4px}
.pg>button{width:100%;text-align:left;font:inherit;font-size:14.5px;font-weight:600;color:#fff;background:none;border:0;padding:10px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.pg>button small{font-size:11.5px;color:rgba(255,255,255,.45);font-weight:500}
.pg>button:hover{background:rgba(255,255,255,.05)}
.pg.open>button{color:var(--gold)}
.pg ol{list-style:none;display:none;padding:0 0 8px 10px}
.pg.open ol{display:block}
.pg li button{width:100%;text-align:left;font:inherit;font-size:13px;color:rgba(255,255,255,.7);background:none;border:0;border-left:2px solid rgba(255,255,255,.1);padding:7px 10px;cursor:pointer;line-height:1.45}
.pg li button:hover{color:#fff;border-left-color:rgba(255,255,255,.4)}
.pg li button.on{color:#fff;border-left-color:var(--gold);background:rgba(212,168,92,.1)}
.pg li button i{font-style:normal;color:var(--gold);font-size:11px;margin-right:6px;font-family:Inter}
main{display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--bd)}
.top h1{font-size:18px;letter-spacing:-.01em}
.top h1 small{font-size:13px;color:var(--tx3);font-weight:500;margin-left:8px}
.ctrl{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--bg);padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--tx2)}
.seg button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ctrl a{font-size:13px;color:var(--sky);font-weight:600;text-decoration:none;padding:6px 8px}
.notes{background:var(--panel);border-bottom:1px solid var(--bd);padding:16px 22px 18px;max-height:34vh;overflow:auto}
.notes .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.notes .hd b{font-size:16px}
.notes .hd span{font-size:12.5px;color:var(--tx3)}
.notes ul{list-style:none;display:grid;gap:7px}
@media(min-width:1500px){.notes ul{grid-template-columns:1fr 1fr;column-gap:28px}}
.notes li{font-size:13.5px;line-height:1.65;color:var(--tx2);padding-left:14px;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--gold)}
.notes li.dec::before{background:var(--ember)}
.notes li em{font-style:normal;font-size:11px;color:var(--sky);font-weight:600;margin-left:6px;white-space:nowrap}
.notes li b{color:var(--tx)}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;overflow:hidden;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.col .lb{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;padding:0 2px 8px}
.col .lb span{padding:3px 9px}
.col.before .lb span{background:#DADDE3;color:var(--tx2)}
.col.after .lb span{background:var(--gold);color:var(--navy)}
.col .lb a{color:var(--tx3);font-weight:500;text-decoration:none}
.frame{flex:1;position:relative;overflow:clip;background:#fff;box-shadow:0 10px 30px -18px rgba(16,27,48,.4);min-height:0}
.frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#fff}
.frame.mobile{background:#dfe2e7;display:flex;justify-content:center}
.dec{display:none;padding:22px;overflow:auto}
body.showdec .stage{display:none}
body.showdec .dec{display:block}
body.showdec .notes{display:none}
.dec h2{font-size:22px;margin-bottom:6px}
.dec p.s{color:var(--tx2);margin-bottom:18px;font-size:14px}
.dec table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
.dec th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-size:13px}
.dec td{padding:12px;border-bottom:1px solid var(--bd);vertical-align:top;line-height:1.7}
.dec td:first-child{font-family:Inter;font-weight:700;color:var(--gold-d);white-space:nowrap}
.dec td:nth-child(2){font-weight:600;width:26%}
.principles{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.principles div{background:#fff;border:1px solid var(--bd);border-top:3px solid var(--gold);padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--tx2)}
.principles b{display:block;color:var(--tx);font-size:14px;margin-bottom:4px}
</style>

    s.label = fix === "nextch" ? `下一章：${s.title}` : fix ? TITLE_FIX[fix] : s.title === "(區塊)" ? (s.dark ? "躍馬段落" : "內容區塊") : s.title;
    return `<li><button data-p="${pi}" data-s="${i}"><i>${String(i + 1).padStart(2, "0")}</i>${s.label}</button></li>`; }).join("")}</ol>`;
  d.firstElementChild.onclick = () => { const was = d.classList.contains("open"); document.querySelectorAll(".pg").forEach(x => x.classList.remove("open")); if (!was) d.classList.add("open"); go(pi, -1); };
  tree.appendChild(d);
});
tree.addEventListener("click", e => { const b = e.target.closest("li button"); if (b) go(+b.dataset.p, +b.dataset.s); });

let device = "desk", curP = 0, curS = -1;
const B = document.getElementById("B"), A = document.getElementById("A");
function notesFor(pg, si) {
  if (si < 0) return { head: `${pg.name} · 整頁`, sub: `${pg.sections.length} 個區塊・點左側子項看每一層`, items: [...PAGE_NOTES] };
  const s = pg.sections[si];
  const items = [];
  s.feats.forEach(f => (RULES[f] || []).forEach(r => items.push(r)));
  if (!items.length || !s.feats.some(f => ["phero", "hero", "ab-hero", "in-hero"].includes(f))) items.push(GENERIC);
  const dec = (DEC_BY_SID[s.sid] || []).map(t => ({ t, ref: "決定", dec: true }));
  const seen = new Set();
  return { head: `${pg.name} · 第 ${si + 1} 層：${s.label}`, sub: s.sid, items: [...dec, ...items.filter(x => !seen.has(x.t) && seen.add(x.t))] };
}
function go(pi, si) {
  curP = pi; curS = si;
  const pg = INV[pi], sid = si < 0 ? pg.id : pg.sections[si].sid;
  document.querySelectorAll(".pg").forEach((x, i) => x.classList.toggle("open", i === pi));
  document.querySelectorAll("li button").forEach(b => b.classList.toggle("on", +b.dataset.p === pi && +b.dataset.s === si));
  const n = notesFor(pg, si);
  document.getElementById("ttl").innerHTML = `${pg.name}<small>${si < 0 ? "整頁" : `第 ${si + 1} / ${pg.sections.length} 層`}</small>`;
  document.getElementById("notes").innerHTML = `<div class="hd"><b>${n.head}</b><span>${n.sub}</span></div><ul>${n.items.map(x => `<li class="${x.dec ? "dec" : ""}">${x.t}<em>${x.ref}</em></li>`).join("")}</ul>`;
  [[B, BEFORE], [A, AFTER]].forEach(([f, file]) => { const url = `${file}#${sid}`;
    if (!f.dataset.file) { f.src = url; f.dataset.file = file; } else f.contentWindow.location.href = new URL(url, location.href).href; });
  document.getElementById("openB").href = `${BEFORE}#${sid}`; document.getElementById("openA").href = `${AFTER}#${sid}`;
  location.hash = `${pg.id}/${si + 1}`;
  setTimeout(sendScrim, 80);
}
function fit() {
  const w = device === "desk" ? 1440 : 390;
  [["fB", B], ["fA", A]].forEach(([id, f]) => { const box = document.getElementById(id); box.classList.toggle("mobile", device !== "desk");
    const sc = Math.min(1, box.clientWidth / w); f.style.width = w + "px"; f.style.height = box.clientHeight / sc + "px"; f.style.transform = `scale(${sc})`;
    f.style.left = device === "desk" ? "0" : `${(box.clientWidth - w * sc) / 2}px`; });
}
let scrim = "local";
const sendScrim = () => A.contentWindow && A.contentWindow.postMessage({ scrim, heroH: device === "desk" ? 900 : 844 }, "*");
A.addEventListener("load", () => setTimeout(sendScrim, 50));
document.getElementById("scrim").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  scrim = b.dataset.m; document.querySelectorAll("#scrim button").forEach(x => x.classList.toggle("on", x === b)); sendScrim(); });
document.getElementById("dev").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  device = b.dataset.d; document.querySelectorAll("#dev button").forEach(x => x.classList.toggle("on", x === b)); fit(); sendScrim();
  setTimeout(() => go(curP, curS), 120); });
addEventListener("resize", fit);
document.querySelector(".tabsw").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".tabsw button").forEach(x => x.classList.toggle("on", x === b)); document.body.classList.toggle("showdec", b.dataset.v === "dec"); });
document.getElementById("decView").innerHTML = `<h2>我照判斷先定的事</h2><p class="s">你說「照你的判斷放上去」，以下是 After 裡已經套用的決定；哪一條要翻，跟我說編號就好。</p>
  <table><thead><tr><th>#</th><th>問題</th><th>決定</th></tr></thead><tbody>${DECISIONS.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table>
  <h2 style="margin-top:34px">這次用到的 apple-design 原則</h2><div class="principles">${PRINCIPLES.map(p => `<div><b>${p[0]}</b>${p[1]}</div>`).join("")}</div>`;

const m = location.hash.slice(1).split("/"); const startP = Math.max(0, INV.findIndex(p => p.id === m[0]));
fit(); go(startP, m[1] ? +m[1] - 1 : -1);
</script>
</body>
</html>
