[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">1</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">不知道該去哪個市場</span><span class="mt-1 block text-[14px] leading-[1.8] text-tx2">訊號：手上有三個以上國家的代理聯絡，但沒有任何一個真的簽下去</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button><button type="button" aria-pressed="false" class="group grid w-full cursor-pointer grid-cols-[30px_1fr_auto] gap-4 border bg-white p-5 text-left outline-none transition-[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">2</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">找不到對的通路或合作夥伴</span><span class="mt-1 block text-[14px] leading-[1.8] text-tx2">訊號：進得去超商、卻進不了量販；或是上架了但產品沒有聲量</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button><button type="button" aria-pressed="false" class="group grid w-full cursor-pointer grid-cols-[30px_1fr_auto] gap-4 border bg-white p-5 text-left outline-none transition-[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">3</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">成本算不清、毛利被吃掉</span><span class="mt-1 block text-[14px] leading-[1.8] text-tx2">訊號：報價時覺得賺的，出貨後發現關稅、物流、匯率分掉一半</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button><button type="button" aria-pressed="false" class="group grid w-full cursor-pointer grid-cols-[30px_1fr_auto] gap-4 border bg-white p-5 text-left outline-none transition-[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">4</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">方向知道，但沒人真的做執行</span><span class="mt-1 block text-[14px] leading-[1.8] text-tx2">訊號：策略簡報看過好幾份，但沒有人真的陪你跑到落地</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button><button type="button" aria-pressed="false" class="group grid w-full cursor-pointer grid-cols-[30px_1fr_auto] gap-4 border bg-white p-5 text-left outline-none transition-[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">5</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">不確定法規、成分或標示過不過得了關</span><span class="mt-1 block text-[14px] leading-[1.8] text-tx2">訊號：產品在台灣合法上架，但不知道目的地的主管機關、成分限制與標示格式</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button></div></div></section><section class="w-full shrink-0 pr-px" aria-hidden="true"><div class="max-w-[760px]"><h2 class="h2 max-w-[680px] text-tx">你主要在看哪個市場？</h2><div class="mt-8 grid gap-3 "><button type="button" aria-pressed="false" class="group grid w-full cursor-pointer grid-cols-[30px_1fr_auto] gap-4 border bg-white p-5 text-left outline-none transition-[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">1</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">菲律賓 / 東南亞</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button><button type="button" aria-pressed="false" class="group grid w-full cursor-pointer grid-cols-[30px_1fr_auto] gap-4 border bg-white p-5 text-left outline-none transition-[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">2</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">美國 / 北美</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button><button type="button" aria-pressed="false" class="group grid w-full cursor-pointer grid-cols-[30px_1fr_auto] gap-4 border bg-white p-5 text-left outline-none transition-[transform,border-color,background-color,opacity] focus-visible:ring-2 focus-visible:ring-gold active:scale-[.985] md:p-6 border-bd [@media(hover:hover)]:hover:-translate-y-px [@media(hover:hover)]:hover:border-navy/40"><span class="grid h-[30px] w-[30px] place-items-center border text-[12px] border-bd text-tx3">3</span><span class="min-w-0"><span class="block text-[17px] font-semibold leading-[1.5] text-tx">其他市場，或還沒決定</span></span><span aria-hidden="true" class="pt-1 text-[17px] text-tx3">→</span></button></div></div></section><section class="w-ful
